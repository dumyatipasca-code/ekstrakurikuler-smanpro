<!DOCTYPE html>
<html lang="id"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ekstrakurikuler SMAN 1 Pronojiwo</title>
<meta name="theme-color" content="#0b3d91">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ekstra SMANPRO">
<style>
html,body{margin:0;height:100%;background:#0b3d91;font-family:system-ui,Segoe UI,Roboto,sans-serif}
#f{position:fixed;inset:0;width:100%;height:100%;border:0;background:#eef2f8;padding-top:env(safe-area-inset-top)}
#s{position:fixed;inset:0;z-index:5;background:linear-gradient(135deg,#0b3d91,#1d63c9);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;transition:opacity .4s}
#s img{width:110px;margin-bottom:12px}#s h1{font-size:19px;margin:0 0 4px}#s p{margin:4px 0;opacity:.85;font-size:14px}
.sp{width:34px;height:34px;border:4px solid #fff4;border-top-color:#f5b301;border-radius:50%;animation:r 1s linear infinite;margin-top:18px}@keyframes r{to{transform:rotate(360deg)}}
button,a.b{background:#f5b301;color:#222;border:0;border-radius:10px;padding:10px 18px;font-weight:700;font-size:14px;margin:6px;cursor:pointer;text-decoration:none;display:inline-block}
#m{display:none}#i{position:fixed;right:12px;bottom:12px;z-index:9;display:none;box-shadow:0 2px 8px #0005}
</style></head><body>
<div id="s"><img src="icon-192.png" alt=""><h1>Aplikasi Ekstrakurikuler</h1><p>SMA Negeri 1 Pronojiwo</p><div class="sp" id="sp"></div>
<div id="m"><p id="mt"></p><button onclick="muat()">Coba Lagi</button><a class="b" id="ob" target="_blank" rel="noopener">Buka Langsung</a></div></div>
<iframe id="f" title="Aplikasi Ekstrakurikuler" allow="camera; microphone; clipboard-write; fullscreen" referrerpolicy="no-referrer-when-downgrade"></iframe>
<button id="i">⬇ Pasang Aplikasi</button>
<script>
const APP_URL='https://script.google.com/macros/s/AKfycbwwgnmDnWKdrlunCS8igFFFIPFKX8ZGopaRdz10NBO5pTb8A_DOhtgAfuLmdyfrfNRb2A/exec';
const f=document.getElementById('f'),s=document.getElementById('s');let T;
document.getElementById('ob').href=APP_URL;
function gagal(t){document.getElementById('sp').style.display='none';document.getElementById('m').style.display='block';document.getElementById('mt').textContent=t;s.style.opacity=1;s.style.pointerEvents='auto'}
function muat(){
  document.getElementById('m').style.display='none';document.getElementById('sp').style.display='block';s.style.opacity=1;s.style.pointerEvents='auto';
  if(!navigator.onLine)return gagal('Tidak ada koneksi internet. Sambungkan internet lalu coba lagi.');
  clearTimeout(T);T=setTimeout(()=>gagal('Aplikasi terlalu lama dimuat. Periksa koneksi atau buka langsung.'),20000);
  f.src=APP_URL;
}
f.addEventListener('load',()=>{clearTimeout(T);s.style.opacity=0;s.style.pointerEvents='none'});
addEventListener('online',muat);addEventListener('offline',()=>gagal('Koneksi internet terputus.'));
muat();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
let dp;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;const b=document.getElementById('i');b.style.display='block';b.onclick=async()=>{b.style.display='none';dp.prompt();await dp.userChoice;dp=null}});
addEventListener('appinstalled',()=>document.getElementById('i').style.display='none');
</script></body></html>
